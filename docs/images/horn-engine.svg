<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#111827">Horn TTC engine (custom Vitis HLS kernel)</text>
  <text x="30" y="54" font-size="12.5" fill="#4b5563">one pass per pyramid level in use (Option A), one pixel per clock (II = 1) · per-box sums out, small solves on the Arm cores</text>

  <g text-anchor="middle">
    <rect x="16" y="80" width="122" height="126" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="77" y="104" font-size="13" font-weight="700" fill="#374151">m_axi in → packer</text>
    <text x="77" y="128" font-size="11.5" fill="#374151">gray t−1, t (8 b)</text>
    <text x="77" y="146" font-size="11.5" fill="#374151">flow u, v</text>
    <text x="77" y="164" font-size="11.5" fill="#374151">(16 b, 1/64 px)</text>
    <text x="77" y="190" font-size="11" fill="#6b7280">+ box and fit tables (m_axi)</text>

    <rect x="156" y="80" width="140" height="126" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="226" y="104" font-size="13" font-weight="700" fill="#065f46">Line buffers</text>
    <text x="226" y="128" font-size="11.5" fill="#374151">S = I(t−1) + I(t)</text>
    <text x="226" y="146" font-size="11.5" fill="#374151">Ex, Ey = Sobel(S)</text>
    <text x="226" y="164" font-size="11.5" fill="#374151">Et = I(t) − I(t−1)</text>
    <text x="226" y="190" font-size="11" fill="#6b7280">12 b / 9 b</text>

    <rect x="314" y="80" width="132" height="126" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="380" y="104" font-size="13" font-weight="700" fill="#065f46">Coordinates</text>
    <text x="380" y="128" font-size="11.5" fill="#374151">x, y from the</text>
    <text x="380" y="146" font-size="11.5" fill="#374151">principal point</text>
    <text x="380" y="164" font-size="11.5" fill="#374151">G = x·Ex + y·Ey</text>
    <text x="380" y="190" font-size="11" fill="#6b7280">21 b</text>

    <rect x="464" y="80" width="132" height="126" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="530" y="104" font-size="13" font-weight="700" fill="#065f46">Shared products</text>
    <text x="530" y="128" font-size="11.5" fill="#374151">11 Horn terms</text>
    <text x="530" y="146" font-size="11.5" fill="#374151">Ex², ExG, G², GEt …</text>
    <text x="530" y="164" font-size="11.5" fill="#374151">12 flow moments</text>
    <text x="530" y="182" font-size="11.5" fill="#374151">x, y, xu, yv …</text>

    <rect x="614" y="80" width="122" height="126" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="675" y="104" font-size="13" font-weight="700" fill="#065f46">Box masks ×16</text>
    <text x="675" y="128" font-size="11.5" fill="#374151">inside the box?</text>
    <text x="675" y="146" font-size="11.5" fill="#374151">|∇E| &gt; threshold</text>
    <text x="675" y="164" font-size="11.5" fill="#374151">(Horn terms)</text>
    <text x="675" y="182" font-size="11.5" fill="#374151">flow box ∧ fit inlier (moments)</text>

    <rect x="754" y="80" width="130" height="126" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="819" y="104" font-size="13" font-weight="700" fill="#065f46">Accumulators</text>
    <text x="819" y="128" font-size="11.5" fill="#374151">16 boxes × 23</text>
    <text x="819" y="146" font-size="11.5" fill="#374151">int64 adders</text>
    <text x="819" y="164" font-size="11.5" fill="#374151">products shared:</text>
    <text x="819" y="182" font-size="11.5" fill="#374151">a box costs adders</text>

    <rect x="464" y="244" width="420" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="674" y="267" font-size="13" font-weight="700" fill="#1e40af">Arm cores: 3×3 least squares per box</text>
    <text x="674" y="287" font-size="11.5" fill="#374151">Horn: A·Ex + B·Ey + C·G + Et = 0 → η = 16·C / Δt · flow moments → divergence</text>

    <rect x="16" y="244" width="430" height="62" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="231" y="267" font-size="12" font-weight="700" fill="#111827">Exact by construction</text>
    <text x="231" y="287" font-size="11.5" fill="#374151">largest product G² &lt; 2⁴²; ≤ 2¹⁸ px per box → sums &lt; 2⁶⁰</text>
  </g>

  <g stroke="#4b5563" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M138,143 H154"/><path d="M296,143 H312"/><path d="M446,143 H462"/><path d="M596,143 H612"/><path d="M736,143 H752"/>
    <path d="M819,206 V242"/>
  </g>
  <text x="812" y="230" font-size="11" fill="#4b5563" text-anchor="end">m_axi → DDR (2.9 KB per pass)</text>
  <text x="30" y="336" font-size="11.5" fill="#047857" font-weight="700">Status: bit-exact with Python and C++ in C-simulation (7 stream + 2 top-level cases: random boxes, thresholds, fit masks, level 1).</text>
  <text x="30" y="352" font-size="11.5" fill="#6b7280">Synthesis needs Zynq UltraScale+ device data for Vitis 2024.2; on-board integration needs the KV260.</text>
</svg>
