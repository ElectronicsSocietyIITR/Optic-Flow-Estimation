<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="950" fill="#ffffff"/>

  <text x="30" y="36" font-size="19" font-weight="700" fill="#111827">Per-frame dataflow</text>
  <text x="30" y="56" font-size="12.5" fill="#4b5563">one 512×288 frame (16:9 source), from pixels to a warning</text>

  <!-- legend -->
  <g font-size="11.5" fill="#374151">
    <rect x="648" y="66" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#059669"/><text x="668" y="78">FPGA logic (PL)</text>
    <rect x="648" y="88" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/><text x="668" y="100">DPU (INT8 neural network)</text>
    <rect x="648" y="110" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/><text x="668" y="122">Arm cores (C++)</text>
    <rect x="648" y="132" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#6b7280"/><text x="668" y="144">DDR buffer</text>
  </g>

  <g text-anchor="middle">
  <!-- row 0 -->
  <rect x="350" y="70" width="200" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="92" font-size="13.5" font-weight="700" fill="#92400e">Camera frame t</text>
  <text x="450" y="110" font-size="11.5" fill="#92400e">30 FPS, timestamped</text>

  <!-- row 1 -->
  <rect x="320" y="160" width="260" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="450" y="184" font-size="13.5" font-weight="700" fill="#065f46">Preprocess</text>
  <text x="450" y="204" font-size="11.5" fill="#374151">resize to 512×288 · INT8 tensor · 5-level pyramid</text>

  <!-- row 2 -->
  <rect x="40" y="270" width="250" height="78" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="165" y="293" font-size="13.5" font-weight="700" fill="#5b21b6">Detector: YOLOv9t-Hardswish</text>
  <text x="165" y="313" font-size="11.5" fill="#374151">boxes for car, truck, bus,</text>
  <text x="165" y="330" font-size="11.5" fill="#374151">motorcycle, bicycle, person</text>

  <rect x="325" y="270" width="250" height="78" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="450" y="293" font-size="13.5" font-weight="700" fill="#065f46">Dense optical flow (LK)</text>
  <text x="450" y="313" font-size="11.5" fill="#374151">u, v for every pixel</text>
  <text x="450" y="330" font-size="11.5" fill="#374151">gray t−1 → gray t</text>

  <rect x="610" y="270" width="250" height="78" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="735" y="293" font-size="13.5" font-weight="700" fill="#374151">Gray ring buffer</text>
  <text x="735" y="313" font-size="11.5" fill="#374151">frames t−1 … t−8, so slow</text>
  <text x="735" y="330" font-size="11.5" fill="#374151">approaches use a longer gap</text>

  <!-- row 3 -->
  <rect x="40" y="392" width="250" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="415" font-size="13.5" font-weight="700" fill="#1e40af">Tracker</text>
  <text x="165" y="435" font-size="11.5" fill="#374151">Kalman on cx, cy, ln√area, aspect</text>
  <text x="165" y="452" font-size="11.5" fill="#374151">Hungarian matching, IoU ≥ 0.3</text>
  <text x="165" y="469" font-size="11.5" fill="#374151">≤ 16 tracks get TTC per frame</text>

  <rect x="325" y="392" width="250" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="415" font-size="13.5" font-weight="700" fill="#1e40af">Ego-rotation</text>
  <text x="450" y="435" font-size="11.5" fill="#374151">background flow grid →</text>
  <text x="450" y="452" font-size="11.5" fill="#374151">rotation + FOE, Gauss–Newton (Cauchy)</text>
  <text x="450" y="469" font-size="11.5" fill="#374151">→ rotation R, heading (FOE), stopped?</text>

  <rect x="610" y="392" width="250" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="735" y="415" font-size="13.5" font-weight="700" fill="#1e40af">Road constant C</text>
  <text x="735" y="435" font-size="11.5" fill="#374151">road flow: TTC_road(y)·(y − y_FOE)</text>
  <text x="735" y="452" font-size="11.5" fill="#374151">→ TTC a parked object would have</text>
  <text x="735" y="469" font-size="11.5" fill="#374151">no calibration, no camera height</text>
  </g>

  <!-- bus -->
  <path d="M138,500 H771" stroke="#4b5563" stroke-width="1.6" fill="none"/>
  <rect x="236" y="489" width="428" height="20" fill="#ffffff"/>
  <text x="450" y="503" text-anchor="middle" font-size="11.5" font-style="italic" fill="#374151">per track: box history · flow · gray frames · rotation R</text>

  <g text-anchor="middle">
  <!-- row 4: TTC methods -->
  <rect x="40" y="524" width="196" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="138" y="547" font-size="13.5" font-weight="700" fill="#1e40af">Looming</text>
  <text x="138" y="567" font-size="11.5" fill="#374151">η = d ln(size) / dt</text>
  <text x="138" y="584" font-size="11.5" fill="#374151">from the tracker's</text>
  <text x="138" y="601" font-size="11.5" fill="#374151">log-scale state</text>

  <rect x="251" y="524" width="196" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="349" y="547" font-size="13.5" font-weight="700" fill="#1e40af">Scale search</text>
  <text x="349" y="567" font-size="11.5" fill="#374151">NCC of the box vs frame t−k</text>
  <text x="349" y="584" font-size="11.5" fill="#374151">s ∈ [0.95, 1.25], sub-step</text>
  <text x="349" y="601" font-size="11.5" fill="#374151">gap k ∈ {1, 2, 4, 8}</text>

  <rect x="462" y="524" width="196" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="560" y="547" font-size="13.5" font-weight="700" fill="#065f46">Horn direct TTC</text>
  <text x="560" y="567" font-size="11.5" fill="#374151">brightness constancy,</text>
  <text x="560" y="584" font-size="11.5" fill="#374151">sums in the HLS engine,</text>
  <text x="560" y="601" font-size="11.5" fill="#374151">3×3 solve on Arm</text>

  <rect x="673" y="524" width="196" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="771" y="547" font-size="13.5" font-weight="700" fill="#1e40af">LK divergence</text>
  <text x="771" y="567" font-size="11.5" fill="#374151">affine fit of the box's flow</text>
  <text x="771" y="584" font-size="11.5" fill="#374151">inliers of last frame’s fit (else RANSAC)</text>
  <text x="771" y="601" font-size="11.5" fill="#374151">camera rotation removed</text>

  <!-- row 5 -->
  <rect x="230" y="650" width="440" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="674" font-size="13.5" font-weight="700" fill="#1e40af">Fusion: per-track EKF on η = 1/TTC</text>
  <text x="450" y="694" font-size="11.5" fill="#374151">constant closing speed · Mahalanobis gate · calibrated variances</text>

  <!-- row 6 -->
  <rect x="90" y="746" width="340" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="260" y="769" font-size="13.5" font-weight="700" fill="#1e40af">Course check</text>
  <text x="260" y="789" font-size="11.5" fill="#374151">r = (x − x_FOE) / w, extrapolated to contact</text>
  <text x="260" y="806" font-size="11.5" fill="#374151">in our path now? · speed towards our path</text>

  <rect x="460" y="746" width="350" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="635" y="769" font-size="13.5" font-weight="700" fill="#1e40af">Lead selection</text>
  <text x="635" y="789" font-size="11.5" fill="#374151">in path (3 frames) or entering it (6 frames)</text>
  <text x="635" y="806" font-size="11.5" fill="#374151">not oncoming (κ ≤ 1.8) · nearest one wins</text>

  <!-- row 7 -->
  <rect x="150" y="862" width="300" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="886" font-size="13.5" font-weight="700" fill="#991b1b">Warning FSM (lead only)</text>
  <text x="300" y="906" font-size="11.5" fill="#374151">WARNING ≤ 2.7 s · CRITICAL ≤ 1.5 s</text>

  <rect x="490" y="862" width="260" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="886" font-size="13.5" font-weight="700" fill="#92400e">Overlay → display</text>
  <text x="620" y="906" font-size="11.5" fill="#374151">boxes · TTC · warning banner</text>
  </g>

  <g stroke="#4b5563" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M450,120 V158"/>
    <path d="M380,226 L170,268"/>
    <path d="M450,226 V268"/>
    <path d="M520,226 L730,268"/>
    <path d="M165,348 V390"/>
    <path d="M450,348 V390"/>
    <path d="M575,435 H608"/>
    <path d="M165,478 V498"/>
    <path d="M450,478 V498"/>
    <path d="M860,309 H882 V500 H771"/>
    <path d="M138,500 V522"/>
    <path d="M349,500 V522"/>
    <path d="M560,500 V522"/>
    <path d="M771,500 V522"/>
    <path d="M138,616 L300,648"/>
    <path d="M349,616 L400,648"/>
    <path d="M560,616 L500,648"/>
    <path d="M771,616 L600,648"/>
    <path d="M400,712 L300,744"/>
    <path d="M500,712 L600,744"/>
    <path d="M430,786 H458"/>
    <path d="M860,450 H892 V786 H812"/>
    <path d="M560,826 L380,860"/>
    <path d="M450,893 H488"/>
  </g>
  <text x="886" y="700" font-size="11" fill="#4b5563" transform="rotate(-90 886 700)" text-anchor="middle">κ = TTC_static / TTC_object</text>
</svg>
