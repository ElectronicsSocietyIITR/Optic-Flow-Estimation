# v++ link configuration for the FCW overlay on the KV260 (hls/system/build_overlay.sh):
#   v++ -l -t hw --platform kv260_fcw.xpfm --config link.cfg dpu.xo preprocess.xo lk_wrapper.xo -o fcw.xclbin
# The Horn engine is left out by default (fabric report, fallback 5.4): linked, DPU B3136 + LK + preprocess
# already need about 145 of the 144 BRAM tiles with the engine, and LUTs reach ~96 %. Add link_engine.cfg
# (ENGINE=1) to link it back in. Our kernels need well under 1 GB/s together; the DPU gets its own ports.

[connectivity]
nk=DPUCZDX8G:1:DPUCZDX8G_1
nk=preprocess:1:preprocess_1
nk=lk_wrapper:1:lk_wrapper_1
sp=DPUCZDX8G_1.M_AXI_GP0:HPC0
sp=DPUCZDX8G_1.M_AXI_HP0:HP0
sp=DPUCZDX8G_1.M_AXI_HP2:HP1
sp=preprocess_1.m_axi_gmem0:HP2
sp=preprocess_1.m_axi_gmem1:HP2
sp=preprocess_1.m_axi_gmem2:HP2
sp=preprocess_1.m_axi_gmem3:HP2
sp=lk_wrapper_1.m_axi_gmem0:HP3
sp=lk_wrapper_1.m_axi_gmem1:HP3
sp=lk_wrapper_1.m_axi_gmem2:HP3
sp=lk_wrapper_1.m_axi_gmem3:HP3

[clock]
freqHz=275000000:DPUCZDX8G_1.aclk
freqHz=550000000:DPUCZDX8G_1.ap_clk_2
# Platform clocks, exact divides of one 1100 MHz VCO. Linked at 300 / 600 / 250 MHz the design missed timing
# by up to 0.22 ns on all three (out of context the kernels alone reach 261 and 279 MHz).
freqHz=220000000:preprocess_1.ap_clk
freqHz=220000000:lk_wrapper_1.ap_clk
