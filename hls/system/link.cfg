# v++ link configuration for the FCW overlay on the KV260. DRAFT: never linked yet. Needs the KV260
# Vitis platform, the DPUCZDX8G XO from the DPU TRD (size: docs/superpowers/reports/2026-10-fabric-budget.md)
# and the Zynq UltraScale+ device data.
#   v++ -l -t hw --platform <kv260 platform .xpfm> --config link.cfg \
#       DPUCZDX8G.xo preprocess.xo lk_wrapper.xo ttc_engine_top.xo -o fcw.xclbin
# Memory names (HP0..HP3, HPC0..HPC1) depend on the platform: check with platforminfo before linking.
# Our kernels need well under 1 GB/s together; the DPU gets its own ports.

[connectivity]
nk=DPUCZDX8G:1:DPUCZDX8G_1
nk=preprocess:1:preprocess_1
nk=lk_wrapper:1:lk_wrapper_1
nk=ttc_engine_top:1:ttc_engine_top_1
sp=DPUCZDX8G_1.M_AXI_GP0:HPC0
sp=DPUCZDX8G_1.M_AXI_HP0:HP0
sp=DPUCZDX8G_1.M_AXI_HP2:HP1
sp=preprocess_1.m_axi_gmem0:HP2
sp=preprocess_1.m_axi_gmem1:HP2
sp=preprocess_1.m_axi_gmem2:HP2
sp=lk_wrapper_1.m_axi_gmem0:HP3
sp=lk_wrapper_1.m_axi_gmem1:HP3
sp=lk_wrapper_1.m_axi_gmem2:HP3
sp=lk_wrapper_1.m_axi_gmem3:HP3
sp=ttc_engine_top_1.m_axi_gmem0:HP2
sp=ttc_engine_top_1.m_axi_gmem1:HP2
sp=ttc_engine_top_1.m_axi_gmem2:HP3
sp=ttc_engine_top_1.m_axi_gmem3:HP3
sp=ttc_engine_top_1.m_axi_gmem4:HP3

[clock]
freqHz=300000000:DPUCZDX8G_1.aclk
freqHz=600000000:DPUCZDX8G_1.ap_clk_2
freqHz=300000000:preprocess_1.ap_clk
freqHz=300000000:lk_wrapper_1.ap_clk
freqHz=300000000:ttc_engine_top_1.ap_clk
