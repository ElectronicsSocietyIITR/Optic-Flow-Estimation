# Adds the Horn engine to the overlay (build_overlay.sh with ENGINE=1). The first linked build with it
# needed 148 of 144 RAMB36 and ~103 % of the LUTs, so it only fits next to a smaller DPU or LK.

[connectivity]
nk=ttc_engine_top:1:ttc_engine_top_1
sp=ttc_engine_top_1.m_axi_gmem0:HP2
sp=ttc_engine_top_1.m_axi_gmem1:HP2
sp=ttc_engine_top_1.m_axi_gmem2:HP3
sp=ttc_engine_top_1.m_axi_gmem3:HP3
sp=ttc_engine_top_1.m_axi_gmem4:HP3

[clock]
# Routed out of context at 301 MHz.
freqHz=220000000:ttc_engine_top_1.ap_clk
